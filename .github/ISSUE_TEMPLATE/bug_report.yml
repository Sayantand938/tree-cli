name: Bug report
description: Something is not working as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A minimal reproduction saves everyone time.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: The command you ran, including the target directory.
      render: shell
      placeholder: tree src --depth 2
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: |
        The actual output, ideally with `--no-color` so escapes are not lost.
        Paste it inside the code block below.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `tree --version`.
      placeholder: 2.0.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v20.11.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Relevant directory structure, symlinks, permission oddities, and so on.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: I am using the latest published version.
          required: true
